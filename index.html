<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>三法守護戰｜將軍澳培智學校</title>
<style>
:root{
  --bg:#0b1b3a; --bg2:#132a52; --card:#183566; --ink:#f4f7ff; --muted:#a9b8d9;
  --accent:#ffd34e; --good:#3dde8c; --bad:#ff6b6b; --a:#5b8cff; --b:#ff8f5b; --c:#c084fc;
  --const:#c62828; --basic:#1565c0; --nsl:#2e7d32;
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif;
  overflow:hidden; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:manipulation;}
body{padding:var(--safe-top) 0 var(--safe-bot);}
button{font:inherit;color:inherit;border:none;cursor:pointer;}
img{pointer-events:none;-webkit-user-drag:none;}
#app{position:relative;width:100%;height:100dvh;max-height:100dvh;overflow:hidden;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:12px 14px 16px;}
.screen.on{display:flex;}
.topbar{display:flex;align-items:center;gap:10px;min-height:52px;}
.topbar .logo{width:40px;height:40px;border-radius:10px;background:#fff;object-fit:contain;padding:2px;}
.topbar .titles{flex:1;min-width:0;}
.topbar h1{margin:0;font-size:clamp(18px,4.2vw,26px);line-height:1.15;}
.topbar p{margin:2px 0 0;font-size:12px;color:var(--muted);}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.08);font-size:13px;}
.btn{border-radius:16px;padding:14px 18px;font-weight:800;font-size:18px;background:linear-gradient(180deg,#ffd34e,#f5b700);color:#1a1200;box-shadow:0 6px 0 #b8860b,0 10px 24px rgba(0,0,0,.35);}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #b8860b;}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:none;}
.btn.good{background:linear-gradient(180deg,#57f0a2,#1fbf6a);color:#062416;box-shadow:0 6px 0 #0f7a42;}
.btn.wide{width:100%;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.card{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px;}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;}
.hero .mascot{font-size:72px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.4));animation:float 2.4s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hint{color:var(--muted);font-size:14px;}
.id-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;align-content:center;}
.id-card{border-radius:20px;padding:16px 12px;text-align:center;background:rgba(255,255,255,.08);border:3px solid transparent;font-weight:800;font-size:20px;}
.id-card .emo{font-size:48px;display:block;margin-bottom:8px;}
.id-card.on{border-color:var(--accent);background:rgba(255,211,78,.15);transform:scale(1.02);}
.map-grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:4px 2px 12px;align-content:start;}
.stage{position:relative;border-radius:18px;padding:14px 12px 12px;min-height:96px;text-align:left;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);}
.stage .n{font-size:12px;opacity:.8;}
.stage .t{font-size:18px;font-weight:900;margin-top:4px;}
.stage .s{font-size:12px;color:var(--muted);margin-top:2px;}
.stage .st{margin-top:8px;font-size:13px;font-weight:700;}
.stage.locked{opacity:.45;filter:grayscale(.4);}
.stage.cleared{outline:2px solid var(--good);}
.stage.theme-constitution{background:linear-gradient(135deg,rgba(198,40,40,.35),rgba(255,255,255,.05));}
.stage.theme-basic{background:linear-gradient(135deg,rgba(21,101,192,.4),rgba(255,255,255,.05));}
.stage.theme-nsl{background:linear-gradient(135deg,rgba(46,125,50,.4),rgba(255,255,255,.05));}
.play-hud{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;}
.play-hud .stat{background:rgba(0,0,0,.25);border-radius:12px;padding:6px 10px;font-weight:800;font-size:14px;}
.qbox{background:rgba(0,0,0,.28);/*q*/border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:12px 14px;margin-bottom:10px;}
.qbox .qid{font-size:12px;color:var(--muted);font-weight:700;}
.qbox .qtext{font-size:clamp(18px,4.6vw,28px);font-weight:900;line-height:1.35;margin-top:4px;}

.qbox{position:relative;}
.qbox .qrow{display:flex;align-items:flex-start;gap:10px;}
.qbox .qrow .qtext{flex:1;min-width:0;}
.btn-speak-q{flex:0 0 auto;width:64px;height:64px;border-radius:18px;font-size:28px;font-weight:900;
  background:linear-gradient(180deg,#7eb6ff,#3d7aef);color:#fff;box-shadow:0 5px 0 #1e4fa8;border:none;}
.btn-speak-q:active{transform:translateY(3px);box-shadow:0 2px 0 #1e4fa8;}
.btn-speak-q.talk{outline:3px solid var(--accent);}
.vk .speak{background:linear-gradient(180deg,#7eb6ff,#3d7aef)!important;border-color:#3d7aef!important;font-size:24px!important;}
.voice-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:8px;}
.voice-bar .info{font-size:12px;color:var(--muted);max-width:100%;text-align:center;}

.arena{position:relative;flex:1;min-height:0;border-radius:22px;overflow:hidden;background:
  radial-gradient(circle at 50% 120%, rgba(255,211,78,.15), transparent 50%),
  linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.2));
  border:1px solid rgba(255,255,255,.12);}
.arena.theme-constitution{box-shadow:inset 0 0 80px rgba(198,40,40,.18);}
.arena.theme-basic{box-shadow:inset 0 0 80px rgba(21,101,192,.22);}
.arena.theme-nsl{box-shadow:inset 0 0 80px rgba(46,125,50,.22);}
#cv{position:absolute;inset:0;width:100%;height:100%;}
.targets{position:absolute;left:0;right:0;top:8%;bottom:28%;display:flex;justify-content:space-evenly;align-items:stretch;gap:8px;padding:0 8px;pointer-events:none;}
.tgt{pointer-events:auto;flex:1;max-width:210px;border-radius:22px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;
  border:3px solid rgba(255,255,255,.25);background:rgba(8,16,36,.72);backdrop-filter:blur(4px);
  box-shadow:0 10px 24px rgba(0,0,0,.35); animation:bob 2.2s ease-in-out infinite; transform-origin:center bottom;}
.tgt:nth-child(2){animation-delay:.35s}
.tgt:nth-child(3){animation-delay:.7s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.tgt .badge{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:900;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25);}
.tgt[data-k=A] .badge{background:var(--a)}
.tgt[data-k=B] .badge{background:var(--b)}
.tgt[data-k=C] .badge{background:var(--c)}
.tgt .otxt{font-size:clamp(13px,3.2vw,18px);font-weight:800;line-height:1.25;text-align:center;padding:0 4px;}
.tgt.flash-good{animation:none;transform:scale(1.06);border-color:var(--good);box-shadow:0 0 0 4px rgba(61,222,140,.35),0 12px 28px rgba(0,0,0,.4);}
.tgt.flash-bad{animation:shake .35s linear;border-color:var(--bad);}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.robot-wrap{position:absolute;left:0;right:0;bottom:6px;height:22%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;pointer-events:none;}
.robot{font-size:clamp(42px,10vw,64px);filter:drop-shadow(0 6px 10px rgba(0,0,0,.45));transition:transform .12s;}
.robot.shoot{transform:translateY(4px) scale(0.96);}
.robot.happy{transform:scale(1.08);}
.vk{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-top:10px;}
.vk button{min-height:56px;border-radius:16px;font-size:22px;font-weight:900;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.14);}
.vk button[data-k=A]{background:rgba(91,140,255,.25);border-color:var(--a)}
.vk button[data-k=B]{background:rgba(255,143,91,.25);border-color:var(--b)}
.vk button[data-k=C]{background:rgba(192,132,252,.25);border-color:var(--c)}
.vk .speak{font-size:20px;}
.toast{position:absolute;left:50%;top:18%;transform:translate(-50%,-10px);background:rgba(0,0,0,.72);padding:10px 16px;border-radius:999px;font-weight:900;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:5;}
.toast.on{opacity:1;transform:translate(-50%,0);}
.overlay{position:absolute;inset:0;background:rgba(4,10,24,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:8;}
.overlay.on{display:flex;}
.panel{width:min(420px,100%);background:linear-gradient(180deg,#1c3a6e,#122648);border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:18px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.45);}
.panel h2{margin:0 0 8px;font-size:26px;}
.panel p{margin:0 0 14px;color:var(--muted);}
.burst{position:absolute;pointer-events:none;font-size:28px;animation:burst .7s ease-out forwards;z-index:6;}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.6);opacity:1}100%{transform:translate(-50%,-120%) scale(1.4);opacity:0}}
.footer-note{text-align:center;font-size:11px;color:var(--muted);margin-top:8px;}
#cert-print-root{display:none;}

/* review mode */
#sc-review{background:linear-gradient(180deg,#0e2248,#0b1b3a);}
#sc-review.screen{display:none;flex-direction:column;}
#sc-review.screen.on{display:flex;}
.rev-card{min-height:180px;}
.rev-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;}
.rev-tabs button{flex:1;min-width:72px;padding:10px 8px;border-radius:14px;font-weight:800;font-size:14px;
  background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.12);}
.rev-tabs button.on{background:rgba(255,211,78,.2);border-color:var(--accent);color:#fff6d0;}
.rev-card{flex:1;min-height:0;overflow:auto;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.12);
  border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px;}
.rev-q{font-size:clamp(18px,4.5vw,26px);font-weight:900;line-height:1.35;}
.rev-opts{display:flex;flex-direction:column;gap:10px;}
.rev-opt{display:flex;align-items:flex-start;gap:12px;text-align:left;padding:14px 12px;border-radius:16px;
  background:rgba(255,255,255,.08);border:3px solid rgba(255,255,255,.14);font-weight:800;font-size:clamp(15px,3.6vw,20px);line-height:1.3;}
.rev-opt .b{flex:0 0 44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;color:#fff;}
.rev-opt[data-k=A] .b{background:var(--a)}
.rev-opt[data-k=B] .b{background:var(--b)}
.rev-opt[data-k=C] .b{background:var(--c)}
.rev-opt.ok{border-color:var(--good);background:rgba(61,222,140,.18);}
.rev-opt.bad{border-color:var(--bad);background:rgba(255,107,107,.14);}
.rev-opt.show-ans{border-color:var(--good);box-shadow:0 0 0 2px rgba(61,222,140,.35);}
.rev-fb{min-height:28px;font-weight:900;font-size:18px;text-align:center;}
.rev-fb.ok{color:var(--good)}
.rev-fb.bad{color:#ffb4b4}
.rev-nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.rev-nav .btn{padding:12px 10px;font-size:16px;}

@media print{
  body *{visibility:hidden !important;}
  #cert-print-root, #cert-print-root *{visibility:visible !important;}
  #cert-print-root{display:block !important; position:fixed; inset:0; background:#fff; color:#111;}
  @page{size:A4 landscape; margin:12mm;}
}
.cert-sheet{width:100%;height:100%;padding:18px;border:8px solid #c5a26f;background:#fffef0;color:#222;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:"PingFang HK","Microsoft JhengHei",sans-serif;}
.cert-sheet h1{font-size:34px;margin:8px 0;color:#8b6914;}
.cert-sheet .big{font-size:28px;font-weight:900;margin:10px 0;}
.cert-sheet .meta{font-size:16px;margin-top:8px;}
.fx-dim{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--x,50%) var(--y,50%), rgba(255,211,78,.35), transparent 42%);opacity:0;transition:opacity .15s;}
.fx-dim.on{opacity:1;}

.prog-wrap{height:10px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden;margin:6px 0 8px;}
.prog-bar{height:100%;width:0%;background:linear-gradient(90deg,#ffd34e,#3dde8c);border-radius:999px;transition:width .35s ease;}
.combo-banner{position:absolute;left:50%;top:4%;transform:translateX(-50%) scale(.8);opacity:0;pointer-events:none;z-index:7;
  font-weight:900;font-size:clamp(18px,5vw,28px);color:#ffd34e;text-shadow:0 0 12px rgba(255,211,78,.8);transition:opacity .15s,transform .15s;}
.combo-banner.on{opacity:1;transform:translateX(-50%) scale(1);}
.edge-flash{position:absolute;inset:0;pointer-events:none;z-index:4;border-radius:22px;opacity:0;transition:opacity .12s;
  box-shadow:inset 0 0 0 6px rgba(61,222,140,.85), inset 0 0 40px rgba(61,222,140,.35);}
.edge-flash.bad{box-shadow:inset 0 0 0 6px rgba(255,107,107,.85), inset 0 0 40px rgba(255,107,107,.3);}
.edge-flash.on{opacity:1;}
.float-score{position:absolute;pointer-events:none;z-index:6;font-weight:900;font-size:22px;color:#ffd34e;
  text-shadow:0 2px 0 #000;animation:floatScore .8s ease-out forwards;}
@keyframes floatScore{0%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-40px) scale(1.2)}}
.tgt{transition:transform .12s, box-shadow .12s;}
.tgt.power{box-shadow:0 0 0 4px rgba(255,211,78,.45),0 12px 28px rgba(0,0,0,.4);}
.robot.power{filter:drop-shadow(0 0 12px #ffd34e) drop-shadow(0 6px 10px rgba(0,0,0,.45));}
.toggle-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:10px;}
.toggle{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.1);
  border:2px solid rgba(255,255,255,.18);font-weight:800;font-size:15px;cursor:pointer;user-select:none;}
.toggle.on{background:rgba(61,222,140,.22);border-color:var(--good);color:#d7ffe8;}
.toggle .dot{width:14px;height:14px;border-radius:50%;background:#888;}
.toggle.on .dot{background:var(--good);box-shadow:0 0 8px var(--good);}
.hud-toggle{padding:6px 10px;font-size:13px;min-height:auto;}
.score-pill{background:rgba(255,211,78,.15)!important;color:var(--accent)!important;}
@media (prefers-reduced-motion: reduce){
  .tgt{animation:none!important;}
  .combo-banner,.float-score,.burst{animation:none!important;}
}


/* === v1.4 game loop === */
.shield-wrap{margin:4px 0 8px;}
.shield-label{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:4px;}
.shield-track{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;height:14px;}
.shield-cell{border-radius:4px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);transition:background .25s, box-shadow .25s;}
.shield-cell.on{background:linear-gradient(180deg,#7dffb5,#1fbf6a);box-shadow:0 0 8px rgba(61,222,140,.55);}
.wave-banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.9);z-index:9;pointer-events:none;
  opacity:0;text-align:center;font-weight:900;padding:14px 22px;border-radius:18px;
  background:rgba(0,0,0,.72);border:2px solid rgba(255,211,78,.55);box-shadow:0 12px 40px rgba(0,0,0,.45);
  transition:opacity .2s, transform .25s;}
.wave-banner.on{opacity:1;transform:translate(-50%,-50%) scale(1);}
.wave-banner .wb-kicker{font-size:13px;color:var(--muted);letter-spacing:.08em;}
.wave-banner .wb-title{font-size:clamp(22px,6vw,34px);color:var(--accent);margin-top:4px;}
.tgt{
  position:relative;
  background:
    radial-gradient(circle at 50% 20%, rgba(255,255,255,.16), transparent 45%),
    linear-gradient(180deg, rgba(20,40,80,.92), rgba(8,16,36,.88));
}
.tgt::before{
  content:attr(data-icon);
  position:absolute;top:-18px;left:50%;transform:translateX(-50%);
  font-size:28px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));
  pointer-events:none;
}
.tgt .ring{position:absolute;inset:-6px;border-radius:26px;border:2px dashed rgba(255,255,255,.2);pointer-events:none;animation:spin 8s linear infinite;}
.tgt.threat .ring{border-color:rgba(255,107,107,.45);}
@keyframes spin{to{transform:rotate(360deg)}}
.tgt.enter{animation:tgtIn .45s cubic-bezier(.2,1.2,.4,1) both;}
.tgt:nth-child(2).enter{animation-delay:.06s}
.tgt:nth-child(3).enter{animation-delay:.12s}
@keyframes tgtIn{from{opacity:0;transform:translateY(-40px) scale(.7)}to{opacity:1;transform:translateY(0) scale(1)}}
.tgt.boom{animation:tgtBoom .5s ease-out forwards!important;pointer-events:none;}
@keyframes tgtBoom{0%{transform:scale(1);opacity:1;filter:brightness(1)}40%{transform:scale(1.2);filter:brightness(1.6)}100%{transform:scale(.2);opacity:0;filter:brightness(2)}}
.tgt .tag{font-size:11px;font-weight:800;opacity:.75;letter-spacing:.04em;}
.reticle{position:absolute;inset:10% 8% 18% 8%;border:2px solid rgba(255,211,78,.0);border-radius:16px;pointer-events:none;transition:border-color .15s, box-shadow .15s;}
.tgt:active .reticle, .tgt:focus-visible .reticle{border-color:rgba(255,211,78,.8);box-shadow:inset 0 0 20px rgba(255,211,78,.15);}
.robot-wrap{gap:4px;}
.robot-base{width:70%;max-width:220px;height:10px;border-radius:999px;background:rgba(255,255,255,.12);margin:0 auto 2px;}
.hp-invader{position:absolute;top:8px;right:8px;font-size:11px;font-weight:900;color:#ffb4b4;opacity:.85;}
.stage .gems{display:flex;gap:3px;margin-top:8px;}
.stage .gem{width:10px;height:10px;border-radius:3px;background:rgba(255,255,255,.15);}
.stage .gem.on{background:var(--good);box-shadow:0 0 6px var(--good);}
.mission{font-size:13px;font-weight:800;color:#d7e6ff;margin:0 0 6px;opacity:.9;}
#sc-play .qbox{margin-bottom:6px;}
.arena-danger{box-shadow:inset 0 0 60px rgba(255,80,80,.12)!important;}


/* === v1.5 STG upgrade === */
.targets{
  display:block !important; /* absolute children drift */
  pointer-events:none;
}
.tgt{
  position:absolute !important;
  width:min(30%, 200px);
  height:auto;
  min-height:140px;
  max-width:200px;
  flex:none !important;
  will-change:left, top, transform;
}
.tgt .hull{
  position:absolute; inset:0; border-radius:22px; pointer-events:none; z-index:0;
  background:
    radial-gradient(circle at 50% 18%, rgba(255,255,255,.28), transparent 40%),
    linear-gradient(165deg, rgba(255,255,255,.12), transparent 42%),
    linear-gradient(180deg, rgba(40,70,130,.95), rgba(10,18,40,.92));
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.14), 0 12px 28px rgba(0,0,0,.45);
}
.tgt.theme-constitution .hull{ background:
  radial-gradient(circle at 50% 18%, rgba(255,200,200,.25), transparent 40%),
  linear-gradient(180deg, rgba(120,30,40,.95), rgba(30,8,12,.92)); }
.tgt.theme-basic .hull{ background:
  radial-gradient(circle at 50% 18%, rgba(200,220,255,.25), transparent 40%),
  linear-gradient(180deg, rgba(30,70,150,.95), rgba(8,20,50,.92)); }
.tgt.theme-nsl .hull{ background:
  radial-gradient(circle at 50% 18%, rgba(200,255,220,.25), transparent 40%),
  linear-gradient(180deg, rgba(30,100,60,.95), rgba(8,30,16,.92)); }
.tgt .eye{
  position:absolute; top:14px; left:50%; transform:translateX(-50%);
  width:54px; height:18px; border-radius:10px; z-index:1; pointer-events:none;
  background:linear-gradient(90deg, transparent, rgba(255,80,80,.85), transparent);
  box-shadow:0 0 12px rgba(255,60,60,.65);
  animation:eyePulse 1.2s ease-in-out infinite;
}
@keyframes eyePulse{0%,100%{opacity:.55; width:40px}50%{opacity:1; width:58px}}
.tgt .fins{
  position:absolute; bottom:10px; left:8px; right:8px; height:8px; z-index:1; pointer-events:none;
  background:repeating-linear-gradient(90deg, rgba(255,211,78,.0) 0 6px, rgba(255,211,78,.35) 6px 10px);
  border-radius:4px; opacity:.7;
}
.tgt .badge, .tgt .otxt, .tgt .tag, .tgt .ring, .tgt .reticle{ position:relative; z-index:2; }
.tgt.boss{
  width:min(32%, 210px) !important;
  max-width:220px !important;
  min-height:168px;
}
.tgt.boss .hull{
  box-shadow: inset 0 0 0 3px rgba(255,211,78,.45), 0 0 30px rgba(255,80,80,.35), 0 16px 40px rgba(0,0,0,.5);
}
.tgt.boss .eye{ height:22px; background:linear-gradient(90deg, transparent, #ffd34e, #ff4d4d, #ffd34e, transparent); }
.tgt.boss .tag{ color:#ffd34e; font-size:13px; }
.boss-bar-wrap{position:absolute; left:12px; right:12px; top:8px; z-index:8; pointer-events:none;
  opacity:0; transition:opacity .2s;}
.boss-bar-wrap.on{opacity:1;}
.boss-bar-label{font-size:12px;font-weight:900;color:#ffd34e;margin-bottom:4px;text-shadow:0 1px 2px #000;}
.boss-bar-track{height:12px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid rgba(255,211,78,.35);overflow:hidden;}
.boss-bar-fill{height:100%;width:100%;background:linear-gradient(90deg,#ff4d4d,#ffd34e);transition:width .35s ease;box-shadow:0 0 10px rgba(255,80,80,.5);}
.arena.boss-mode{box-shadow:inset 0 0 100px rgba(255,60,60,.22), inset 0 0 40px rgba(255,211,78,.12)!important;}
.tgt.drift-paused{ /* keep */ }


.tgt .ship-spr{
  position:relative; z-index:2; width:72px; height:66px; margin:2px auto 0;
  image-rendering: pixelated; image-rendering: crisp-edges;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,.45));
  pointer-events:none; display:block;
}
.tgt.boss .ship-spr{ width:92px; height:84px; }
.tgt .hull{ opacity:.35; } /* keep faint hull under pixel ship */
.tgt::before{ display:none !important; } /* hide emoji icon */

.clear-sum{max-height:min(42vh,280px);overflow:auto;text-align:left;margin:10px 0 12px;
  background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px;}
.clear-sum h3{margin:0 0 8px;font-size:15px;color:var(--accent);}
.clear-sum .ok-all{color:var(--good);font-weight:900;text-align:center;padding:12px;}
.clear-item{border-top:1px solid rgba(255,255,255,.1);padding:8px 2px;font-size:13px;line-height:1.35;}
.clear-item .q{font-weight:800;margin-bottom:4px;}
.clear-item .bad{color:#ffb4b4;}
.clear-item .good{color:#9dffc0;font-weight:800;}
.shield-cell{background-size:contain;background-position:center;background-repeat:no-repeat;opacity:.35;}
.shield-cell.on{opacity:1;background-color:transparent!important;
  background-image:var(--shield-on); filter:drop-shadow(0 0 4px rgba(61,222,140,.6));}
.boom-pop{position:absolute;z-index:7;pointer-events:none;width:48px;height:48px;

function syncSpeakToggles(){
  const on = !!state.autoSpeak;
  [['tog-auto-speak', on ? '自動讀題 · 開' : '自動讀題 · 關'],
   ['tog-auto-speak-play', on ? '讀題 ON' : '讀題 OFF'],

}

function beep(ok){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!beep.ctx) beep.ctx = new AC();
    const ctx = beep.ctx;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = ok ? 'triangle' : 'sawtooth';
    o.frequency.value = ok ? 660 : 180;
    g.gain.value = 0.04;
    o.connect(g); g.connect(ctx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + (ok?0.18:0.12));
    o.stop(ctx.currentTime + 0.2);
  }catch(e){}
}

function fanfare(){
  [523,659,784,1046].forEach((f,i)=>{
    setTimeout(()=>{
      try{
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return;
        if(!beep.ctx) beep.ctx = new AC();
        const ctx = beep.ctx;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type='square'; o.frequency.value=f;
        g.gain.value=0.03; o.connect(g); g.connect(ctx.destination);
        o.start(); g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.2);
        o.stop(ctx.currentTime+0.22);
      }catch(e){}
    }, i*120);
  });
}

/* TTS — buy-xx / Math Guardian 同級：zh-HK 優先 + voiceschanged + 手動大🔊 + 出題自動讀 */
let voices = [];
let ttsRate = 0.9;
function loadVoices(){
  try{ voices = window.speechSynthesis ? (speechSynthesis.getVoices() || []) : []; }catch(e){ voices = []; }
}
loadVoices();
if(typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined){
  speechSynthesis.onvoiceschanged = loadVoices;
}
function pickVoice(){
  const v = voices || [];
  return v.find(x=>/zh-HK|yue.*HK|hong\s*kong/i.test((x.lang||'')+' '+(x.name||'')))
    || v.find(x=>/yue|cantonese|廣東|香港/i.test((x.lang||'')+' '+(x.name||'')))
    || v.find(x=>/zh-TW|zh_TW/i.test(x.lang||''))
    || v.find(x=>/zh-CN|zh_CN|chinese/i.test((x.lang||'')+' '+(x.name||'')))
    || null;
}
function stopSpeak(){
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  const bq = $('#btn-speak-q'); if(bq) bq.classList.remove('talk');
  const bs = $('#btn-speak'); if(bs) bs.classList.remove('talk');
}
function speak(text, opts){
  opts = opts || {};
  if(!text) return;
  try{
    if(!window.speechSynthesis){ toast('呢部機冇語音'); return; }
    loadVoices();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    const v = pickVoice();
    u.lang = (v && v.lang) || 'zh-HK';
    u.rate = opts.rate != null ? opts.rate : ttsRate;
    if(v) u.voice = v;
    u.onstart = function(){
      const bq = $('#btn-speak-q'); if(bq) bq.classList.add('talk');
      const bs = $('#btn-speak'); if(bs) bs.classList.add('talk');
    };
    u.onend = u.onerror = function(){
      const bq = $('#btn-speak-q'); if(bq) bq.classList.remove('talk');
      const bs = $('#btn-speak'); if(bs) bs.classList.remove('talk');
    };
    speechSynthesis.speak(u);
  }catch(e){}
}
function questionSpeakText(){
  const q = currentQ();
  if(!q) return '';
  const parts = [q.q];
  $$('#targets .tgt').forEach(function(t){
    const lab = t.querySelector('.otxt');
    parts.push(t.dataset.k + '，' + (lab ? lab.textContent : ''));
  });
  return parts.join('。');
}
function autoSpeakQuestion(){
  // 預設 ON：每題先讀一次題+答案；toggle 可關；🔊永遠可手動
  if(!state.autoSpeak) return;
  const t = questionSpeakText();
  if(!t) return;
  setTimeout(function(){ speak(t); }, 220);
}
function voiceSelfTest(){
  loadVoices();
  const v = pickVoice();
  const info = $('#voice-info');
  const zh = (voices||[]).filter(x => /zh|yue/i.test(x.lang||''));
  let msg;
  if(v) msg = '✅ 用緊：' + v.name + '（' + v.lang + '）';
  else if(zh.length) msg = '⚠️ 搵唔到港式，會用：' + zh[0].name;
  else msg = '❌ 呢部裝置冇中文語音';
  if(info) info.textContent = msg;
  toast(msg);
  speak('三法守護戰。請揀正確答案。');
}

/* ===== ID ===== */
function renderId(){
  const g = $('#id-grid');
  g.innerHTML = '';
  IDS.forEach(p=>{
    const b = document.createElement('button');
    b.type='button'; b.className='id-card'+(state.player&&state.player.id===p.id?' on':'');
    b.innerHTML = `<span class="emo">${p.emo}</span>${p.name}`;

      state.player = p;
      $$('.id-card').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      $('#btn-id-go').disabled = false;
      beep(true);
    };

  });

}

  save(); renderMap(); show('map');
};

/* ===== MAP ===== */
function renderMap(){
  $('#map-player').textContent = (state.player? state.player.emo+' '+state.player.name : '守護者');
  const clearedN = Object.keys(state.cleared).length;
  $('#map-stats').textContent = `✅ ${clearedN}/10 · 錯 ${state.totalWrong}`;
  const g = $('#map-grid');
  g.innerHTML = '';
  DATA.stages.forEach(st=>{
    const locked = st.id > state.unlocked;
    const cleared = !!state.cleared[st.id];
    const b = document.createElement('button');
    b.type='button';
    b.className = `stage theme-${st.theme}${locked?' locked':''}${cleared?' cleared':''}`;
    const gems = '<div class="gems">' + Array.from({length:10}, function(_,i){
      return '<span class="gem'+(cleared?' on':'')+'"></span>';
    }).join('') + '</div>';
    b.innerHTML = '<div class="n">關卡 '+st.id+' · 波 '+st.from+'-'+st.to+'</div>'
      + '<div class="t">'+st.title+'</div>'
      + '<div class="s">'+st.sub+'</div>'
      + gems
      + '<div class="st">'+(locked?'🔒 未解鎖':(cleared?'🛡 護盾完成':'▶ 迎擊入侵'))+'</div>';
    b.onclick = ()=>{
      if(locked){ toast('先打前面關'); beep(false); return; }
      startStage(st.id);
    };
    g.appendChild(b);
  });
  $('#btn-map-cert').style.display = allCleared() ? 'block' : 'none';
}

function addTrauma(a){
  if(REDUCED) return;
  state.cam.trauma = Math.min(1, state.cam.trauma + a);
}
function hitStop(ms){
  if(REDUCED || !ms) return;
  state.hitStopUntil = Math.max(state.hitStopUntil, performance.now() + ms);
}
function pulseEdge(ok){
  const el = $('#edge-flash');
  if(!el) return;
  el.classList.toggle('bad', !ok);
  el.classList.add('on');
  clearTimeout(pulseEdge._t);
  pulseEdge._t = setTimeout(function(){ el.classList.remove('on'); }, 160);
}
function showCombo(n){
  const el = $('#combo-banner');
  if(!el) return;
  if(n < 2){ el.classList.remove('on'); return; }
  el.textContent = '連對 ×' + n + (n>=5 ? ' 🔥' : '');
  el.classList.add('on');
  clearTimeout(showCombo._t);
  showCombo._t = setTimeout(function(){ el.classList.remove('on'); }, 700);
}
function floatScore(el, text){
  const arena = $('#arena');
  if(!arena || !el) return;
  const ar = arena.getBoundingClientRect();
  const tr = el.getBoundingClientRect();
  const d = document.createElement('div');
  d.className = 'float-score';
  d.textContent = text;
  d.style.left = (tr.left + tr.width/2 - ar.left) + 'px';
  d.style.top = (tr.top + tr.height*0.2 - ar.top) + 'px';
  arena.appendChild(d);
  setTimeout(function(){ d.remove(); }, 850);
}
function updateProg(){
  const bar = $('#prog-bar');
  if(!bar) return;
  // filled cells = completed questions in stage
  const done = Math.min(10, state.idx + (state.phase==='clearing'?1:0));
  bar.style.width = (state.idx / 10 * 100) + '%';
}
function ensureShieldTrack(){
  const tr = $('#shield-track');
  if(!tr) return null;
  if(tr.children.length!==10){
    tr.innerHTML = '';
    for(let i=0;i<10;i++){
      const c=document.createElement('div');
      c.className='shield-cell';
      tr.appendChild(c);
    }
  }
  // CSS var for on-state icon
  try{ document.documentElement.style.setProperty('--shield-on', 'url('+FX_SPR.shieldOn+')'); }catch(e){}
  return tr;
}
function updateShield(){
  ensureShieldTrack();
  const tr = $('#shield-track');
  if(!tr) return;
  const filled = Math.min(10, state.idx); // cells lit = already cleared waves before current
  // when answering wave n (idx 0-based), show idx filled after clear we'll bump
  const show = state.shieldLit|0;
  [...tr.children].forEach((c,i)=> c.classList.toggle('on', i < show));
  const st = $('#shield-txt');
  if(st) st.textContent = show + '/10';
}
function isBossWave(){
  // 每關最後 3 波 = Boss 突襲（idx 7,8,9）
  return (state.idx|0) >= 7;
}
function updateBossBar(){
  const wrap = $('#boss-bar-wrap');
  if(!wrap) return;
  const on = isBossWave() || (state.bossHp>0 && state.idx>=7);
  wrap.classList.toggle('on', on && state.screen==='play');
  const lab = $('#boss-bar-label');
  const fill = $('#boss-bar-fill');
  const hp = Math.max(0, state.bossHp|0);
  const mx = Math.max(1, state.bossMax|0);
  if(lab) lab.textContent = on ? ('BOSS 護甲 '+hp+'/'+mx) : '';
  if(fill) fill.style.width = (Math.max(0, hp)/mx*100)+'%';
}
function clearDrifts(){
  state.drifts = [];
  const box = $('#targets');
  if(box){ box.style.transform=''; }
}
function layoutTargetsForDrift(){
  const box = $('#targets');
  if(!box) return;
  const els = $$('#targets .tgt');
  const W = box.clientWidth || 1;
  const H = box.clientHeight || 1;
  const n = els.length;
  state.drifts = [];
  const boss = isBossWave() && n===3;
  // boss layout: one big center? keep 3 but larger spacing; mark center as boss shell look on all with boss class on container
  els.forEach(function(el, i){
    el.classList.toggle('boss', isBossWave());
    const tw = el.offsetWidth || Math.min(W*0.3, 200);
    const th = el.offsetHeight || 150;
    // initial x slots
    let x, y;
    if(isBossWave()){
      // triangle-ish: left, top-center, right — slow sway
      if(i===0){ x = W*0.06; y = H*0.28; }
      else if(i===1){ x = (W-tw)/2; y = H*0.08; }
      else { x = W*0.94 - tw; y = H*0.28; }
    } else {
      const slot = (i+0.5)/n;
      x = slot * W - tw/2;
      y = H*0.18 + (i%2)*12;
    }
    x = Math.max(4, Math.min(W - tw - 4, x));
    y = Math.max(4, Math.min(H - th - 8, y));
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.right = 'auto';
    el.style.bottom = 'auto';
    const speed = isBossWave() ? (0.18 + i*0.04) : (0.35 + i*0.08);
    const dir = (i%2===0) ? 1 : -1;
    state.drifts.push({
      el: el,
      x: x,
      y: y,
      vx: speed * dir,
      baseY: y,
      phase: i * 1.7,
      amp: isBossWave() ? 6 : 10,
      w: tw,
      h: th
    });
  });
}
function tickDrifts(dt){
  if(state.phase==='clearing' || state.screen!=='play') return;
  const box = $('#targets');
  if(!box || !state.drifts || !state.drifts.length) return;
  // don't fight camera translate on box — drifts set left/top on el; cam still translates box
  const W = box.clientWidth || 1;
  const H = box.clientHeight || 1;
  const t = performance.now()/1000;
  state.drifts.forEach(function(d){
    if(!d.el || !d.el.isConnected) return;
    if(d.el.classList.contains('boom')) return;
    d.x += d.vx * (dt*60); // scale ~px per frame at 60fps baseline
    // bounce
    const maxX = Math.max(4, W - (d.w||d.el.offsetWidth||160) - 4);
    if(d.x < 4){ d.x = 4; d.vx = Math.abs(d.vx); }
    if(d.x > maxX){ d.x = maxX; d.vx = -Math.abs(d.vx); }
    const yy = d.baseY + Math.sin(t * 1.3 + d.phase) * d.amp;
    d.el.style.left = d.x.toFixed(1) + 'px';
    d.el.style.top = yy.toFixed(1) + 'px';
    // boss class uses translateX(-50%) which breaks left — neutralize during drift
    if(d.el.classList.contains('boss')){
      d.el.style.transform = 'none';
    }
  });
}

function tryAnswer(displayLetter, srcKey, el){
  if(state.locked || state.screen!=='play') return;
  const q = currentQ();
  const ok = srcKey === q.ans;
  const robot = $('#robot');
  // shoot visual toward target
  shootTo(el, ok);
  if(ok){
    state.locked = true;
    state.phase = 'clearing';
    el.classList.add('flash-good','boom');
    // sink other invaders
    $$('#targets .tgt').forEach(function(t){
      if(t!==el){ t.style.opacity='.35'; t.style.filter='grayscale(.6)'; t.style.pointerEvents='none'; }
    });
    robot.classList.add('happy');
    state.streak += 1;
    state.totalCorrect += 1;
    state.shieldLit = Math.min(10, (state.shieldLit|0) + 1);
    updateShield();
    if(isBossWave()){
      state.bossHp = Math.max(0, (state.bossHp|0) - 1);
      updateBossBar();
    }
    if(isBossWave()){
      const src = bossSpr();
      $$('#targets .tgt:not(.boom) .ship-spr').forEach(function(img){ img.src = src; });
    }
    beep(true);
    burst(el, state.streak>=3?'💥✨':'✨'); boomPop(el);
    juiceCorrect(el);
    clearDrifts();
    if(isBossWave()){
      toast(state.bossHp>0 ? ('BOSS 護甲 -1 · 剩 '+state.bossHp) : 'BOSS 擊破！');
      speak(state.bossHp>0 ? '打中' : 'Boss 打倒');
      showWaveBanner(state.bossHp>0 ? ('護甲 '+state.bossHp+'/3') : 'BOSS 擊破', 'BOSS');
    } else {
      toast(state.streak>=3?('連對×'+state.streak+' 護盾+1'):'擊落！護盾+1');
      speak(state.streak>=3?('啱喇！連對'+state.streak):'啱喇');
      showWaveBanner('擊落！', 'SHIELD +1');
    }
    const ar = $('#arena'); if(ar) ar.classList.remove('arena-danger');
    setTimeout(function(){
      robot.classList.remove('happy');
      nextQ();
    }, state.streak>=3 ? 920 : 780);
  }else{
    el.classList.add('flash-bad');
    robot.classList.add('shoot');
    state.streak = 0;
    state.stageWrong += 1;
    state.totalWrong += 1;
    // teaching log (first wrong pick per question) — letters = on-screen A/B/C
    try {
      const qid = q.id;
      if(!state.stageMisses.some(function(m){ return m.id===qid; })){
        state.stageMisses.push({
          id: qid,
          q: q.q,
          pick: displayLetter,
          pickText: q.opts[srcKey],
          ans: state.ansDisplay || q.ans,
          ansText: q.opts[q.ans]
        });
      }
    } catch(e){}
    beep(false);
    juiceWrong(el);
    toast('未擊落 · 再射！');
    speak('再試啦');
    showWaveBanner('未擊落', 'RETRY');
    $('#hud-streak').textContent = `🔥 0`;
    $('#hud-wrong').textContent = `錯 ${state.stageWrong}`;
    setTimeout(()=>{
      el.classList.remove('flash-bad');
      robot.classList.remove('shoot');
    }, 380);
    save();
  }
  $('#hud-streak').textContent = `🔥 ${state.streak}`;
}

      ? `全線護盾完成！總錯 ${state.totalWrong} · ⭐${state.runScore}`
      : `護盾 10/10！錯 ${state.stageWrong} · ⭐+${state.stageScore} · 下一防線已開`;

function shootTo(el, ok, silent){
  const arena = $('#arena');
  const ar = arena.getBoundingClientRect();
  const rr = $('#robot').getBoundingClientRect();
  const tr = el.getBoundingClientRect();
  const x0 = rr.left + rr.width/2 - ar.left;
  const y0 = rr.top + rr.height*0.2 - ar.top;
  const x1 = tr.left + tr.width/2 - ar.left + (silent ? (Math.random()-0.5)*24 : 0);
  const y1 = tr.top + tr.height/2 - ar.top + (silent ? (Math.random()-0.5)*16 : 0);
  const streakBoost = Math.min(3, state.streak|0);
  const bImg = ok ? ((state.streak|0)>=3 ? FX_SPR.bulletPower : FX_SPR.bullet) : null;
  state.bullets.push({
    x:x0,y:y0,x1,y1,t:0,life:1, ok, img:bImg,
    color: ok ? (streakBoost>=3 ? '#fff36a' : '#ffd34e') : '#ff6b6b',
    w: ok ? 4 + streakBoost : 3
  });
  if(!silent){
    $('#robot').classList.add('shoot');
    setTimeout(()=>$('#robot').classList.remove('shoot'), 120);
    const fx = $('#fx');
    fx.style.setProperty('--x', (x1/ar.width*100)+'%');
    fx.style.setProperty('--y', (y1/ar.height*100)+'%');
    fx.classList.add('on');
    setTimeout(()=>fx.classList.remove('on'), 180);
  }
  if(ok){
    const n = silent ? 6 : (10 + Math.min(12, state.streak*2));
    for(let i=0;i<n;i++){
      state.particles.push({
        x:x1,y:y1,
        vx:(Math.random()-0.5)*7,
        vy:(Math.random()-0.5)*7-2,
        life:1,
        c: ['#ffd34e','#fff','#3dde8c','#5b8cff','#ff8f5b'][i%5]

function startLoop(){
  stopLoop();
  state.lastTs = performance.now();
  const loop = (now)=>{
    const dt = Math.min(0.05, (now - (state.lastTs||now)) / 1000);
    state.lastTs = now;
    // hit-stop: still decay cam/fx, skip bullet advance a bit
    const frozen = now < state.hitStopUntil;
    updateCam(dt);
    if(!frozen) tickDrifts(dt);
    draw(frozen ? dt*0.35 : dt);
    state.raf = requestAnimationFrame(loop);
  };
  state.raf = requestAnimationFrame(loop);
}
function stopLoop(){
  if(state.raf) cancelAnimationFrame(state.raf);
  state.raf = 0;
}
function updateCam(dt){
  const cam = state.cam;
  if(cam.trauma <= 0 || REDUCED){ cam.x = cam.y = 0; cam.trauma = 0; return; }
  cam.trauma = Math.max(0, cam.trauma - cam.decay * dt);
  const s = cam.trauma * cam.trauma;
  const t = performance.now() * 0.03;
  cam.x = cam.max * s * Math.sin(t * 1.7);
  cam.y = cam.max * s * Math.sin(t * 2.3);
  // apply soft offset to targets layer only (not hitboxes logic — DOM still clickable)
  const tg = $('#targets');
  if(tg) tg.style.transform = 'translate(' + cam.x.toFixed(2) + 'px,' + cam.y.toFixed(2) + 'px)';
  const rob = $('#robot');
  if(rob) rob.style.transform = (rob.classList.contains('shoot')?'translateY(4px) scale(0.96)': rob.classList.contains('happy')?'scale(1.08)':'') + ' translate(' + (cam.x*0.5).toFixed(2) + 'px,' + (cam.y*0.5).toFixed(2) + 'px)';
}

function draw(dt){
  dt = dt == null ? 0.016 : dt;
  const arena = $('#arena');
  const w = arena.clientWidth, h = arena.clientHeight;
  if(!w||!h) return;
  ctx.clearRect(0,0,w,h);
  ctx.save();
  ctx.translate(state.cam.x, state.cam.y);
  // parallax stars
  const tnow = Date.now();
  for(let i=0;i<28;i++){
    const layer = (i%3)+1;
    const x = (i*97 + tnow/(50/layer)) % w;
    const y = (i*53 + (tnow/80)*layer*0.02) % (h*0.6);
    ctx.globalAlpha = 0.06 * layer;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x, y, 1.1*layer*0.5, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // theme accent orbs
  const th = (stageMeta(state.stageId)||{}).theme || 'constitution';
  const accent = th==='basic' ? 'rgba(91,140,255,.12)' : th==='nsl' ? 'rgba(61,222,140,.12)' : 'rgba(255,107,107,.12)';
  ctx.fillStyle = accent;
  ctx.beginPath(); ctx.arc(w*0.15, h*0.2, 40+Math.sin(tnow/400)*6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(w*0.85, h*0.25, 30+Math.cos(tnow/350)*5, 0, Math.PI*2); ctx.fill();

  // bullets
  state.bullets = state.bullets.filter(b=>{
    b.t += 0.14;
    const t = Math.min(1, b.t);
    const x = b.x + (b.x1-b.x)*t;
    const y = b.y + (b.y1-b.y)*t;
    ctx.strokeStyle = b.color;
    ctx.lineWidth = b.w || 4;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(x,y);
    ctx.stroke();
    ctx.shadowBlur = 0;
    if(b.img){
      if(!b._im){ b._im = new Image(); b._im.src = b.img; }
      const s = ((state.streak|0)>=3?18:14);
      if(b._im.complete){ ctx.drawImage(b._im, x-s/2, y-s/2, s, s); }
      else { ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.fill(); }
    } else {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.fill();
    }
    return t < 1;
  });
  // particles
  state.particles = state.particles.filter(p=>{
    p.x += p.vx; p.y += p.vy; p.vy += 0.14; p.life -= 0.028;
    ctx.globalAlpha = Math.max(0,p.life);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,3.5,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    return p.life > 0;
  });
  // confetti
  state.confetti = state.confetti.filter(c=>{
    c.x += c.vx; c.y += c.vy; c.rot += c.vr; c.life -= 0.012;
    ctx.save();
    ctx.globalAlpha = Math.max(0, c.life);
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.fillStyle = c.c;
    ctx.fillRect(-c.s/2, -c.s/2, c.s, c.s*0.6);
    ctx.restore();
    return c.life > 0 && c.y < h + 20;
  });
  ctx.restore();
}

window.addEventListener('resize', ()=>{ if(state.screen==='play') resizeCv(); });

/* ===== CERT ===== */

/* ===== REVIEW MODE（純溫習 · 無遊戲） ===== */
const REV = {
  part: 'all', // all|const|basic|nsl
  list: [],
  idx: 0,
  answered: false,
  revealed: false
};
function revFilterIds(part){
  if(part==='const') return DATA.questions.filter(q=>q.id>=1 && q.id<=40);
  if(part==='basic') return DATA.questions.filter(q=>q.id>=41 && q.id<=70);
  if(part==='nsl') return DATA.questions.filter(q=>q.id>=71 && q.id<=100);
  return DATA.questions.slice();
}
function enterReview(part){
  REV.part = part || 'all';
  REV.list = revFilterIds(REV.part);
  REV.idx = 0;
  REV.answered = false;
  REV.revealed = false;
  // tabs UI
  $$('#rev-tabs button').forEach(b=>{
    b.classList.toggle('on', b.getAttribute('data-part')===REV.part);
  });
  syncSpeakToggles();
  show('review');
  renderReview();
}
function revCurrent(){
  return REV.list[REV.idx] || null;
}
function revSpeakText(){
  const q = revCurrent();
  if(!q) return '';
  const parts = [q.q];
  // display order A B C fixed in review (no shuffle — 溫習要穩定)
  ['A','B','C'].forEach(function(L){
    parts.push(L + '，' + q.opts[L]);
  });
  return parts.join('。');
}
function revAutoSpeak(){
  if(!state.autoSpeak) return;
  const t = revSpeakText();
  if(!t) return;
  setTimeout(function(){ speak(t); }, 200);
}
function renderReview(){
  const q = revCurrent();
  if(!q){
    $('#rev-q').textContent = '呢部分冇題';
    $('#rev-opts').innerHTML = '';
    return;
  }
  REV.answered = false;
  REV.revealed = false;
  $('#rev-prog').textContent = (REV.idx+1) + '/' + REV.list.length;
  $('#rev-qid').textContent = '總題 ' + q.id + ' · ' + (
    q.id<=40 ? '憲法' : q.id<=70 ? '基本法' : '國安法'
  );
  $('#rev-q').textContent = q.q;
  $('#rev-fb').textContent = '';
  $('#rev-fb').className = 'rev-fb';
  const box = $('#rev-opts');
  if(!box){ console.warn('rev-opts missing'); return; }
  box.innerHTML = '';
  ['A','B','C'].forEach(function(L){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'rev-opt';
    b.dataset.k = L;
    b.innerHTML = '<span class="b">'+L+'</span><span class="t"></span>';
    b.querySelector('.t').textContent = q.opts[L];
    b.onclick = function(){ revTry(L); };
    box.appendChild(b);
  });
  revAutoSpeak();
}
function revTry(letter){
  const q = revCurrent();
  if(!q) return;
  const ok = letter === q.ans;
  // allow re-try until correct / reveal, but mark feedback
  $$('#rev-opts .rev-opt').forEach(function(el){
    el.classList.remove('ok','bad','show-ans');
    if(el.dataset.k === letter){
      el.classList.add(ok ? 'ok' : 'bad');
    }
  });
  const fb = $('#rev-fb');
  if(ok){
    REV.answered = true;
    fb.textContent = '啱喇 ✓';
    fb.className = 'rev-fb ok';
    beep(true);
    speak('啱喇');
    // reveal correct styling
    $$('#rev-opts .rev-opt').forEach(function(el){
      if(el.dataset.k === q.ans) el.classList.add('show-ans');
    });
  } else {
    fb.textContent = '再試 · 或撳「睇答案」';
    fb.className = 'rev-fb bad';
    beep(false);
    speak('再試啦');
  }
}
function revReveal(){
  const q = revCurrent();
  if(!q) return;
  REV.revealed = true;
  REV.answered = true;
  $$('#rev-opts .rev-opt').forEach(function(el){
    el.classList.remove('bad');
    if(el.dataset.k === q.ans) el.classList.add('ok','show-ans');
  });
  const fb = $('#rev-fb');
  fb.textContent = '答案係 ' + q.ans + '：' + q.opts[q.ans];
  fb.className = 'rev-fb ok';
  speak('答案係' + q.ans + '，' + q.opts[q.ans]);
}
function revNext(delta){
  if(!REV.list.length) return;
  REV.idx = (REV.idx + delta + REV.list.length) % REV.list.length;
  stopSpeak();
  renderReview();
}
function wireReview(){
  const br = $('#btn-review');
  if(br) br.onclick = function(){ enterReview('all'); };
  const bmr = $('#btn-map-review');
  if(bmr) bmr.onclick = function(){ enterReview('all'); };
  const home = $('#btn-rev-home');
  if(home) home.onclick = function(){ stopSpeak(); show('home'); };
  $$('#rev-tabs button').forEach(function(b){
    b.onclick = function(){
      enterReview(b.getAttribute('data-part')||'all');
    };
  });
  const sp = $('#btn-rev-speak');
  if(sp) sp.onclick = function(){ const t=revSpeakText(); if(t) speak(t); };
  const tr = $('#tog-auto-speak-rev');
  if(tr) tr.onclick = toggleAutoSpeak;
  const bp = $('#btn-rev-prev'); if(bp) bp.onclick = function(){ revNext(-1); };
  const bn = $('#btn-rev-next'); if(bn) bn.onclick = function(){ revNext(1); };
  const bv = $('#btn-rev-reveal'); if(bv) bv.onclick = function(){ revReveal(); };
  // keys in review
  window.addEventListener('keydown', function(e){
    if(state.screen!=='review') return;
    const k = e.key.toUpperCase();
    if(k==='A'||k==='B'||k==='C'){ e.preventDefault(); revTry(k); }
    if(e.key==='ArrowRight' || e.key==='Enter'){ e.preventDefault(); revNext(1); }
    if(e.key==='ArrowLeft'){ e.preventDefault(); revNext(-1); }
  });
}
wireReview();


function openCert(){
  const r = rankInfo();
  const name = state.player ? (state.player.emo+' '+state.player.name) : '同學';
  const detail = `完成 100 題 · 總錯 ${state.totalWrong} 次 · 總對 ${state.totalCorrect} 次`;
  $('#cert-rank').textContent = r.emoji+' '+r.name;
  $('#cert-name').textContent = name;
  $('#cert-detail').textContent = detail;
  $('#p-rank').textContent = r.emoji+' '+r.name;
  $('#p-name').textContent = name;
  $('#p-detail').textContent = detail;
  $('#p-date').textContent = new Date().toLocaleDateString('zh-HK');
  show('cert');
  speak(r.name + '。' + (state.player?state.player.name:'同學') + '，做得好');
}
$('#btn-print').onclick = ()=> window.print();
$('#btn-cert-map').onclick = ()=>{ renderMap(); show('map'); };

loadSettings();
syncSpeakToggles();
const t1 = $('#tog-auto-speak'); if(t1) t1.onclick = toggleAutoSpeak;
const t2 = $('#tog-auto-speak-play'); if(t2) t2.onclick = toggleAutoSpeak;
initHome();
// prevent scroll bounce
document.addEventListener('touchmove', e=>{
  if(e.target.closest && e.target.closest('.map-grid')) return;
  e.preventDefault();
},{passive:false});
})();
